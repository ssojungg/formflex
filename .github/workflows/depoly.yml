name: Deploy Backend to Lambda

on:
  push:
    # 모든 브랜치에서 push 발생 시 실행
    paths:
      - "backend/**"
      - "index.js"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "index.js"

jobs:
  build:
    name: 빌드 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node.js 22 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 프로덕션 의존성 패키지 설치
        working-directory: backend
        run: npm ci --omit=dev
      - name: 배포용 압축 파일 생성
        run: |
          cd backend
          zip -r ../lambda.zip . --exclude ".env" --exclude "*.git"
      - name: 빌드 결과 확인
        run: ls -lh lambda.zip

  deploy:
    name: 람다 배포
    needs: build
    runs-on: ubuntu-latest
    # ★ 핵심 수정: push 이벤트면 무조건 배포 (브랜치 조건 삭제)
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Chromium Lambda Layer 생성
        run: |
          mkdir -p chromium-layer/nodejs
          cd chromium-layer/nodejs
          npm init -y
          npm install @sparticuz/chromium@147 puppeteer-core@24 --omit=dev
          cd ../..
          zip -r chromium-layer.zip chromium-layer/

      - name: S3로 Layer 및 Backend 업로드
        run: |
          aws s3 cp chromium-layer.zip s3://${{ secrets.AWS_BUCKET }}/layers/chromium-layer.zip
          cd backend
          zip -r ../lambda.zip . --exclude ".env" --exclude "*.git"
          aws s3 cp ../lambda.zip s3://${{ secrets.AWS_BUCKET }}/deploy/lambda.zip

      - name: Chromium Layer 배포 (S3 소스 사용)
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query 'Account' --output text)
          LAYER_VERSION=$(aws lambda publish-layer-version \
            --layer-name formflex-chromium \
            --content S3Bucket=${{ secrets.AWS_BUCKET }},S3Key=layers/chromium-layer.zip \
            --compatible-runtimes nodejs22.x \
            --query 'Version' \
            --output text)
          echo "LAYER_ARN=arn:aws:lambda:${{ secrets.AWS_REGION }}:${ACCOUNT_ID}:layer/formflex-chromium:${LAYER_VERSION}" >> $GITHUB_ENV

      - name: S3에서 람다 함수 배포
        run: |
          aws lambda update-function-code \
              --function-name ${{ secrets.AWS_LAMBDA_FUNCTION_NAME }} \
              --s3-bucket ${{ secrets.AWS_BUCKET }} \
              --s3-key deploy/lambda.zip
          aws lambda wait function-updated \
            --function-name ${{ secrets.AWS_LAMBDA_FUNCTION_NAME }}

      - name: Lambda 핸들러 및 Layer 설정
        run: |
          aws lambda update-function-configuration \
            --function-name ${{ secrets.AWS_LAMBDA_FUNCTION_NAME }} \
            --handler handler.handler \
            --layers ${{ env.LAYER_ARN }}
          aws lambda wait function-updated \
            --function-name ${{ secrets.AWS_LAMBDA_FUNCTION_NAME }}
