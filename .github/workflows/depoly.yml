name: Deploy Backend to Lambda

# on : 언제 실행할지
on:
  push:
    paths:
      - "backend/**"
      - "index.js"
      - ".github/workflows/**"
      - "serverless.yml"

concurrency:
  group: lambda-deploy
  cancel-in-progress: false

jobs:
  build:
    name: 빌드 검증
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node.js 22 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 프로덕션 의존성 패키지 설치
        working-directory: backend
        run: npm ci --omit=dev

      - name: 배포용 압축 파일 생성
        run: |
          cd backend
          zip -r ../lambda.zip . \
             --exclude ".env" \
             --exclude "*.git"

      - name: 빌드 결과 확인
        run: ls -lh lambda.zip

      - name: lambda.zip artifact 저장
        uses: actions/upload-artifact@v4
        with:
          name: lambda-zip
          path: lambda.zip
          retention-days: 1

  deploy-staging:
    name: 스테이징 배포 ($LATEST)
    needs: build
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'

    steps:
      - name: lambda.zip artifact 다운로드
        uses: actions/download-artifact@v4
        with:
          name: lambda-zip

      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: S3로 압축 파일 업로드
        run: |
          aws s3 cp lambda.zip s3://${{ secrets.AWS_BUCKET }}/deploy-staging/lambda.zip

      - name: formflex-dev 람다 배포
        run: |
          aws lambda update-function-code \
              --function-name formflex-dev \
              --s3-bucket ${{ secrets.AWS_BUCKET }} \
              --s3-key deploy-staging/lambda.zip \
              --architectures x86_64

      - name: 배포 완료 대기
        run: |
          aws lambda wait function-updated \
            --function-name formflex-dev

      - name: 최신 Chromium Layer ARN 조회
        run: |
          LAYER_ARN=$(aws lambda list-layer-versions \
            --layer-name formflex-chromium \
            --query 'LayerVersions[0].LayerVersionArn' \
            --output text)
          echo "LAYER_ARN=${LAYER_ARN}" >> $GITHUB_ENV

      - name: Lambda 함수 설정 업데이트
        run: |
          aws lambda update-function-configuration \
            --function-name formflex-dev \
            --memory-size 2048 \
            --timeout 120 \
            --layers${{env.LAYER_ARN}}
          aws lambda wait function-updated \
            --function-name formflex-dev

  deploy-prod:
    name: 프로덕션 배포 (prod alias)
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: lambda.zip artifact 다운로드
        uses: actions/download-artifact@v4
        with:
          name: lambda-zip

      - name: Node.js 22 설정(Chromium Layer 빋드용)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Chromium Lambda Layer 생성
        run: |
          mkdir -p chromium-layer/nodejs
          cd chromium-layer/nodejs
          npm init -y
          npm install @sparticuz/chromium@147 puppeteer-core@24 --omit=dev
          cd ..
          zip -r ../chromium-layer.zip nodejs/
          cd ..
          echo "Layer zip size: $(ls -lh chromium-layer.zip | awk '{print $5}')"

      - name: Chromium Layer 배포
        run: |
          aws s3 cp chromium-layer.zip s3://${{ secrets.AWS_BUCKET }}/layers/chromium-layer.zip
          LAYER_ARN=$(aws lambda publish-layer-version \
            --layer-name formflex-chromium \
            --content S3Bucket=${{ secrets.AWS_BUCKET }},S3Key=layers/chromium-layer.zip \
            --compatible-runtimes nodejs22.x \
            --compatible-architectures x86_64 \
            --query 'LayerVersionArn' \
            --output text)
          echo "LAYER_ARN=${LAYER_ARN}" >> $GITHUB_ENV

      - name: S3로 압축 파일 업로드
        run: |
          aws s3 cp lambda.zip s3://${{ secrets.AWS_BUCKET }}/deploy/lambda.zip

      - name: S3에서 람다 함수 배포
        run: |
          aws lambda update-function-code \
              --function-name formflex-prod \
              --s3-bucket ${{ secrets.AWS_BUCKET }} \
              --s3-key deploy/lambda.zip \
              --architectures x86_64

      - name: 배포 완료 대기
        run: |
          aws lambda wait function-updated \
            --function-name formflex-prod

      - name: Lambda 핸들러 및 Layer 설정
        run: |
          aws lambda update-function-configuration \
            --function-name formflex-prod \
            --handler handler.handler \
            --memory-size 2048 \
            --timeout 120 \
            --layers ${{ env.LAYER_ARN }}
          aws lambda wait function-updated \
            --function-name formflex-prod

      - name: 버전 publish 및 prod alias 업데이트
        run: |
          VERSION=$(aws lambda publish-version \
            --function-name formflex-prod \
            --query 'Version' \
            --output text)
          aws lambda update-alias \
            --function-name formflex-prod \
            --name prod \
            --function-version $VERSION
