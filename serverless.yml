service: formflex

provider:
  name: aws
  runtime: nodejs22.x
  architecture: x86_64
  region: ap-northeast-2
  timeout: 120
  memorySize: 1536
  environment:
    NODE_ENV: production
    FRONTEND_URL: ${env:FRONTEND_URL}
functions:
  api:
    name: formflex
    handler: index.handler
    events:
      - http:
          path: /
          method: ANY
          cors: true
      - http:
          path: /{proxy+}
          method: ANY
          cors: true
plugins:
  - serverless-dotenv-plugin
