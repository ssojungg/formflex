service: formflex

provider:
  name: aws
  runtime: nodejs22.x
  architecture: x86_64
  region: ap-northeast-2
  timeout: 120
  memorySize: 1536
  environment:
    NODE_ENV: ${opt:stage, 'production'}
    # opt: option 줄인말
    # 값 넘기면 그걸로, 없으면 production
    FRONTEND_URL: ${env:FRONTEND_URL}
functions:
  api:
    name: ${opt:stage, 'formflex'}
    # --stage 로 넘긴 값 써. 안 넘겼으면 formflex 써
    handler: index.handler
    events:
      - http:
          path: /
          method: ANY
          cors: true
      - http:
          path: /{proxy+}
          method: ANY
          cors: true
plugins:
  - serverless-dotenv-plugin
